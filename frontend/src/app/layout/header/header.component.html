<header class="header">
  <div class="header-left">
    <button class="icon-btn" (click)="toggleSidebar.emit()" title="Menu">
      <span class="material-symbols-rounded">menu</span>
    </button>
    <div class="search">
      <span class="material-symbols-rounded search-icon">search</span>
      <input type="text" placeholder="Rechercher produit, client, BL..." />
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" title="Notifications">
      <span class="material-symbols-rounded">notifications</span>
      <span class="notif-dot"></span>
    </button>
    
    <div class="user-menu">
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-email">{{ userEmail }}</span>
      </div>
      <div class="avatar" title="{{ userName }}">AD</div>
      <button class="logout-btn" (click)="logout()" title="Déconnexion">
        <span class="material-symbols-rounded">logout</span>
      </button>
    </div>
  </div>
</header>
