<aside class="sidebar" [class.collapsed]="collapsed">
  <!-- Brand -->
  <div class="brand">
    <img src="assets/logo.png" alt="Bôdélice" class="brand-img" [class.brand-img-sm]="collapsed" />
  </div>

  <div class="divider"></div>

  <!-- Nav -->
  <nav class="nav">
    <span *ngIf="!collapsed" class="nav-label">NAVIGATION</span>
    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
       class="nav-item"
       [title]="collapsed ? item.label : ''">
      <span class="material-symbols-rounded nav-icon">{{ item.icon }}</span>
      <span *ngIf="!collapsed" class="nav-text">{{ item.label }}</span>
      <span *ngIf="item.badge && !collapsed" class="nav-badge">{{ item.badge }}</span>
    </a>
 
  </nav>
    <aside class="sidebar" [class.collapsed]="collapsed">

  <!-- TOP -->
  <div class="sidebar-top">
    <div class="brand">
      <img src="assets/logo.png" alt="Bôdélice"
           class="brand-img"
           [class.brand-img-sm]="collapsed" />
    </div>

    <div class="divider"></div>
  </div>

  <!-- MIDDLE (scrollable) -->
  <nav class="nav">
    <span *ngIf="!collapsed" class="nav-label">NAVIGATION</span>

    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       routerLinkActive="active"
       class="nav-item">

      <span class="material-symbols-rounded nav-icon">
        {{ item.icon }}
      </span>

      <span *ngIf="!collapsed" class="nav-text">
        {{ item.label }}
      </span>

      <span *ngIf="item.badge && !collapsed" class="nav-badge">
        {{ item.badge }}
      </span>

    </a>
  </nav>

  <!-- BOTTOM -->
  <div class="sidebar-bottom">

    <button class="collapse-btn" (click)="toggleCollapse.emit()">
      <span class="material-symbols-rounded">
        {{ collapsed ? 'chevron_right' : 'chevron_left' }}
      </span>
      <span *ngIf="!collapsed">Réduire</span>
    </button>
    <div class="divider"></div>
    <button class="nav-item logout" (click)="logout()">
      <span class="material-symbols-rounded nav-icon">logout</span>
      <span *ngIf="!collapsed" class="nav-text">Déconnexion</span>
    </button>

    

    

  </div>

</aside>
